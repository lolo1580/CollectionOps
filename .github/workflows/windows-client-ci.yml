name: Windows Client CI

on:
  push:
    branches: [main]
    paths:
      - "client-windows/**"
      - ".github/workflows/windows-client-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "client-windows/**"
      - ".github/workflows/windows-client-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-client-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Restore and build x64
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore client-windows/CollectionOps.Client/CollectionOps.Client.csproj -p:Platform=x64

      - name: Build client
        run: dotnet build client-windows/CollectionOps.Client/CollectionOps.Client.csproj --configuration Release --no-restore -p:Platform=x64

